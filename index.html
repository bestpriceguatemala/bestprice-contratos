<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Best Price — Contratos</title>
<!--
  El `?v=` de las hojas de estilo NO es un número a mano: es un pedazo del contenido de las tres hojas
  juntas (su hash). Lo vigila `pruebas/carros.test.mjs` y, si alguien cambia el CSS sin cambiarlo aquí, la
  prueba se pone roja y dice el valor nuevo que hay que pegar.

  Por qué hace falta. Esto estuvo en `?v=1` desde el principio, o sea sin cambiar nunca: después de
  publicar, un navegador que ya había entrado seguía usando la hoja VIEJA hasta que se le venciera la
  caché. Se encontró el 26 de noviembre de 2026 así: se agregó la clase `.btn-peligro` para el botón de
  borrar, el archivo en disco la tenía, y el navegador seguía pintando el botón igual al de «Cancelar».

  Lo que esto NO arregla, dicho para que nadie crea que sí: los módulos de `js/`. `js/app.js?v=…` solo
  afecta a app.js; todo lo que app.js importa se pide con su ruta pelada y se guarda en caché por su
  cuenta. Versionarlos pediría un paso de compilación, y este programa no tiene ninguno a propósito. Ahí
  manda la caché de GitHub Pages (unos diez minutos), así que un cambio de código recién publicado puede
  tardar ese rato en verse. Si hay que verlo ya: recargar con Ctrl+Shift+R (Cmd+Shift+R en Mac).
-->
<link rel="stylesheet" href="css/estilos.css?v=2ab9d0a6">
<link rel="stylesheet" href="css/contrato-papel.css?v=2ab9d0a6">
<link rel="stylesheet" href="css/respaldo.css?v=2ab9d0a6">
</head>
<body>
  <div id="entrada" class="entrada">
    <form id="forma-entrada" class="tarjeta-entrada">
      <h1>Best Price</h1>
      <p class="sub">Contratos de renta</p>
      <label>Usuario <input type="email" id="usuario" autocomplete="username" required></label>
      <label>Contraseña <input type="password" id="clave" autocomplete="current-password" required></label>
      <button type="submit" class="btn btn-primario">Entrar</button>
      <p id="error-entrada" class="error" hidden></p>
    </form>
  </div>

  <div id="app" hidden>
    <header class="barra">
      <strong>Best Price — Contratos</strong>
      <!--
        La caja de búsqueda de §6 («Buscador general»): js/pantallas/buscador.js la conecta al arrancar (app.js). Todo lo que ella pinta
        —la caja y el panel de resultados— lleva `no-imprimir`: la barra ya se esconde al imprimir, pero el contrato se imprime sobre papel
        preimpreso y un panel abierto encima de la hoja sería lo que el cliente firma; que no dependa de dónde esté puesto.
      -->
      <div class="buscador-caja no-imprimir">
        <input type="search" id="buscador" class="no-imprimir" placeholder="Buscar cliente, placas o número de contrato"
          aria-label="Buscar cliente, placas o número de contrato" autocomplete="off" spellcheck="false"
          role="combobox" aria-expanded="false" aria-controls="buscador-lista" aria-autocomplete="list">
        <div id="buscador-panel" class="buscador-panel no-imprimir" hidden></div>
      </div>
      <nav>
        <a href="#/flota">Flota</a>
        <a href="#/reservas">Reservas</a>
        <a href="#/calendario">Calendario</a>
        <a href="#/carros">Carros</a>
        <a href="#/clientes">Clientes</a>
        <a href="#/contratos">Contratos</a>
        <a href="#/dinero">Dinero</a>
        <a href="#/dinero/respaldo">Respaldo</a>
        <!-- Ajustes sigue oculto: ninguna pantalla lo atiende todavía (ni app.js ni router.js lo cablean). -->
        <a href="#/ajustes" hidden>Ajustes</a>
      </nav>
      <button id="salir" class="btn">Salir</button>
    </header>
    <main id="pantalla"></main>
  </div>

  <div id="avisos" class="avisos"></div>
  <script type="module" src="js/app.js?v=1"></script>
</body>
</html>
